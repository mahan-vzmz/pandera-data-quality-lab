[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pandera-data-quality-lab"
version = "0.3.0"
description = "Problem-driven Pandera and data-quality learning project"
requires-python = ">=3.10"
dependencies = [
    "pandera[pandas]==0.32.1",
    "pandas>=2.1,<3.0",
]

[project.optional-dependencies]
dev = [
    "jupyterlab>=4,<5",
    "pytest>=8,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
