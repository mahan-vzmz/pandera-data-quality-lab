[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pandera-data-quality-lab"
version = "0.1.0"
description = "Problem-driven Pandera and data-quality learning project"
requires-python = ">=3.10"
dependencies = [
    "pandera[pandas]",
    "pandas",
]

[project.optional-dependencies]
dev = [
    "jupyterlab",
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
